name: Descargar M1 acciones Dukascopy y procesar ORB

# Dukascopy no es accesible desde el entorno de Claude: la descarga y el resumen diario corren
# aquí; solo se sube el resumen por acción y día (orb_acciones/datos/), no las velas.
on:
  push:
    branches: [claude/project-thread-1ei3pv]
    paths:
      - .github/workflows/descargar-acciones-m1.yml
      - orb_acciones/procesar.py

concurrency:
  group: acciones-m1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        sim: [AAPL, AMZN, BABA, BAC, GOOGL, FB, MSFT, NFLX, NVDA, PFE, T, TSLA, V, WMT, ZM, BA, KO, DIS, INTC, AMD, NKE, JPM, PYPL,
              AABV, ABT, ACN, ADBE, AVGO, C, CAT, CMCSA, COST, CRM, CSCO, CVX, GE, GS, HD, IBM, JNJ, LLY, LOW, MA, MCD, MDT, MMM, MO,
              MRK, MS, ORCL, PEP, PG, QCOM, SBUX, TGT, TMO, TXN, UNH, UNP, UPS, USB, VZ, WFC, XOM, GILD, AMGN, BMY, HON, LMT, F, GM]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar M1 bid y ask 2018-2026
        run: |
          mkdir -p velas && cd velas
          npm init -y >/dev/null && npm i dukascopy-node@1 >/dev/null 2>&1
          INS=$(echo "${{ matrix.sim }}" | tr A-Z a-z)ususd
          for Y in 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            HASTA=$((Y+1))-01-01; [ $Y = 2026 ] && HASTA=2026-11-13
            for P in bid ask; do
              npx dukascopy-node -i $INS -from $Y-01-01 -to $HASTA -t m1 -p $P -v -f csv -dir . -r 5 -bs 20 -bp 300 -fr >/dev/null 2>&1 || echo "falla $Y $P"
            done
          done
          ls -la *.csv | head -30
      - name: Procesar
        run: |
          pip install -q pandas numpy
          mkdir -p salida
          python orb_acciones/procesar.py ${{ matrix.sim }} velas salida/${{ matrix.sim }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: orb-${{ matrix.sim }}
          path: salida/

  juntar:
    needs: bajar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Guardar
        run: |
          mkdir -p orb_acciones/datos
          find art -name '*.csv' -exec cp {} orb_acciones/datos/ \;
          ls orb_acciones/datos | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orb_acciones/datos
          git diff --cached --quiet || git commit -m "Acciones: resumen diario por acción (v2 con precios para hueco)"
          git pull --rebase -q || true
          git push
