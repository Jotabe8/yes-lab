name: v10-bis Alpaca (volumen con signo QQQ 9:30-9:40)

on:
  push:
    branches: [claude/project-thread-4zk8lb]
    paths:
      - .github/workflows/v10-alpaca.yml
      - metodo/v10/descargar_alpaca.py

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        y: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: clave
        run: |
          if [ -z "$K" ]; then echo "Faltan los secretos ALPACA_KEY_ID y ALPACA_SECRET: no se hace nada."; echo "hay=no" >> $GITHUB_OUTPUT
          else echo "hay=si" >> $GITHUB_OUTPUT; fi
        env:
          K: ${{ secrets.ALPACA_KEY_ID }}
      - if: steps.clave.outputs.hay == 'si'
        run: pip install -q pandas numpy && python metodo/v10/descargar_alpaca.py ${{ matrix.y }}
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - if: steps.clave.outputs.hay == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: qqq-${{ matrix.y }}
          path: metodo/v10/datos/

  juntar:
    needs: [bajar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Guardar y analizar
        run: |
          ls art 2>/dev/null | grep -q qqq || { echo "sin datos"; exit 0; }
          mkdir -p metodo/v10/datos && cp art/*/*.csv metodo/v10/datos/
          pip install -q pandas numpy && python metodo/v10/analizar_alpaca.py || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add metodo/v10/ && git commit -m "v10-bis: datos QQQ Alpaca y análisis" && git pull --rebase && git push || echo "nada que guardar"
