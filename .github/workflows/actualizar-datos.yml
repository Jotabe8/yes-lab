name: Actualizar datos de mercado

on:
  # Programación en pausa por decisión de Jorge (2026-10-01): se lanza a mano cuando haga falta.
  # Para reactivarla, descomentar estas líneas.
  # schedule:
  #   - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest -v
      - name: Descargar cierres
        run: python -m lab.fetch --years 10
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Datos de mercado $(date -u +%F)"
          git push
