name: Descargar velas intradía

# Binance no es accesible desde el entorno de trabajo de Claude: esta descarga corre en GitHub
# y sube el archivo a la misma rama.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/descargar-intradia.yml

permissions:
  contents: write

jobs:
  intradia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar BTCUSDT 30m
        run: python -m lab.intradia BTCUSDT --interval 30m --desde 2017-08-17
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_intradia
          git diff --cached --quiet || git commit -m "Velas intradía BTCUSDT 30m $(date -u +%F)"
          git push
