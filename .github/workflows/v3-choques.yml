name: v3 choques 5 min

on:
  push:
    branches: [claude/project-thread-dqtmmk]
    paths:
      - .github/workflows/v3-choques.yml
      - metodo/v3/choques.py

permissions:
  contents: write

jobs:
  anio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        par: ["US100:usatechidxusd", "US500:usa500idxusd", "US30:usa30idxusd", "GER40:deuidxeur"]
        y: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y resumir
        env:
          PAR: ${{ matrix.par }}
        run: |
          SIM=${PAR%%:*}; INS=${PAR##*:}; Y=${{ matrix.y }}
          HASTA=$((Y+1))-01-02; [ $Y = 2026 ] && HASTA=2026-11-13
          mkdir -p velas salida && cd velas
          npm init -y >/dev/null && npm i dukascopy-node@1 >/dev/null 2>&1
          for P in bid ask; do npx dukascopy-node -i $INS -from $((Y-1))-11-01 -to $HASTA -t m1 -p $P -f csv -dir . -r 5 -bs 20 -bp 300 -fr >/dev/null 2>&1 || echo falla $P; done
          ls | head
          cd .. && pip install -q pandas numpy && python metodo/v3/choques.py $SIM velas $Y salida/choques_${SIM}_$Y.csv || echo sin datos
      - uses: actions/upload-artifact@v4
        with:
          name: choq-${{ strategy.job-index }}
          path: salida/
          if-no-files-found: ignore

  juntar:
    needs: anio
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Guardar
        run: |
          mkdir -p metodo/v3/choques
          find art -name '*.csv' -exec cp {} metodo/v3/choques/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metodo/v3/choques
          git diff --cached --quiet || git commit -m "v3: choques 5 min 2012-2026"
          git pull --rebase -q || true
          git push
