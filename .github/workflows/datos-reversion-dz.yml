name: Datos reversion DZ

# Yahoo está bloqueado desde el entorno de Claude: la descarga corre aquí.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-pwsqqq]
    paths:
      - .github/workflows/datos-reversion-dz.yml

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p datos_reversion_dz
          pip install -q yfinance pandas
          python3 - <<'PY'
          import yfinance as yf
          tick = {"GSPC": "^GSPC", "NDX": "^NDX", "RUT": "^RUT", "DJI": "^DJI", "GDAXI": "^GDAXI",
                  "STOXX50E": "^STOXX50E", "VIX": "^VIX"}
          for n, t in tick.items():
              try:
                  d = yf.download(t, start="1999-01-01", auto_adjust=False, progress=False)
                  d.columns = [c[0] if isinstance(c, tuple) else c for c in d.columns]
                  d[["Open", "High", "Low", "Close"]].to_csv(f"datos_reversion_dz/{n}.csv"); print(n, len(d))
              except Exception as e: print("falla", n, e)
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_reversion_dz
          git diff --cached --quiet || git commit -m "Datos reversion DZ $(date -u +%F)"
          git pull --rebase -q || true
          git push
