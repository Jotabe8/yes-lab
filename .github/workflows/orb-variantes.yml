name: Variantes ORB 2012-2026

on:
  push:
    branches: [claude/project-thread-1ei3pv]
    paths:
      - .github/workflows/orb-variantes.yml
      - orb_acciones/orb_variantes.py

permissions:
  contents: write

jobs:
  anio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        par: ["US100:usatechidxusd", "US500:usa500idxusd", "US30:usa30idxusd"]
        y: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
        exclude:
          - {par: "US30:usa30idxusd", y: 2012}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y resumir
        env:
          PAR: ${{ matrix.par }}
        run: |
          SIM=${PAR%%:*}; INS=${PAR##*:}; Y=${{ matrix.y }}
          HASTA=$((Y+1))-01-02; [ $Y = 2026 ] && HASTA=2026-11-13
          mkdir -p velas salida && cd velas
          npm init -y >/dev/null && npm i dukascopy-node@1 >/dev/null 2>&1
          for P in bid ask; do npx dukascopy-node -i $INS -from $((Y-1))-11-01 -to $HASTA -t m1 -p $P -f csv -dir . -r 5 -bs 20 -bp 300 -fr >/dev/null 2>&1 || echo falla $P; done
          cd .. && pip install -q pandas numpy && python orb_acciones/orb_variantes.py $SIM velas $Y salida/var_${SIM}_$Y.csv
      - uses: actions/upload-artifact@v4
        with:
          name: var-${{ strategy.job-index }}
          path: salida/

  juntar:
    needs: anio
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Guardar
        run: |
          mkdir -p orb_acciones/orb_var
          find art -name '*.csv' -exec cp {} orb_acciones/orb_var/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orb_acciones/orb_var
          git diff --cached --quiet || git commit -m "Variantes ORB 2012-2026"
          git pull --rebase -q || true
          git push
