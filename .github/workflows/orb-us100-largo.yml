name: ORB US100 2011-2026 (réplica en Python)

on:
  push:
    branches: [claude/project-thread-1ei3pv]
    paths:
      - .github/workflows/orb-us100-largo.yml
      - orb_acciones/orb_us100.py

permissions:
  contents: write

jobs:
  anio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        y: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y replicar
        run: |
          Y=${{ matrix.y }}; DESDE=$((Y-1))-11-01; HASTA=$((Y+1))-01-01; [ $Y = 2026 ] && HASTA=2026-11-13
          mkdir -p velas salida && cd velas
          npm init -y >/dev/null && npm i dukascopy-node@1 >/dev/null 2>&1
          for P in bid ask; do npx dukascopy-node -i usatechidxusd -from $DESDE -to $HASTA -t m1 -p $P -f csv -dir . -r 5 -bs 20 -bp 300 -fr >/dev/null 2>&1 || echo falla $P; done
          cd .. && pip install -q pandas numpy && python orb_acciones/orb_us100.py velas $Y salida/orb_$Y.csv
      - uses: actions/upload-artifact@v4
        with:
          name: orb-${{ matrix.y }}
          path: salida/

  juntar:
    needs: anio
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Guardar
        run: |
          mkdir -p orb_acciones/orb_us100
          find art -name '*.csv' -exec cp {} orb_acciones/orb_us100/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orb_acciones/orb_us100
          git diff --cached --quiet || git commit -m "ORB US100 réplica 2012-2026"
          git pull --rebase -q || true
          git push
