name: Descargar acciones diarias

# Yahoo no es accesible desde el entorno de trabajo de Claude: esta descarga corre en GitHub
# y sube los archivos a la misma rama.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/descargar-acciones.yml

permissions:
  contents: write

jobs:
  acciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar OHLCV diario desde 2005
        run: python -m lab.acciones --desde 2005-01-01
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_acciones
          git diff --cached --quiet || git commit -m "Velas diarias de acciones $(date -u +%F)"
          git push
