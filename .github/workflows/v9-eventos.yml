name: v9 M1 en ventana de datos macro

on:
  push:
    branches: [claude/project-thread-9n5zdo]
    paths:
      - .github/workflows/v9-eventos.yml
      - metodo/v9/extraer.py

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        par: ["XAUUSD:xauusd", "EURUSD:eurusd", "GBPUSD:gbpusd", "USDJPY:usdjpy", "US100:usatechidxusd", "US500:usa500idxusd"]
        tramo: ["2011:2018", "2019:2026"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y extraer
        run: |
          SIM=${PAR%%:*}; INS=${PAR##*:}; Y0=${TRAMO%%:*}; Y1=${TRAMO##*:}
          mkdir -p velas salida && cd velas
          npm init -y >/dev/null && npm i dukascopy-node@1 >/dev/null 2>&1
          for Y in $(seq $Y0 $Y1); do
            HASTA=$((Y+1))-01-01; [ $Y = 2026 ] && HASTA=2026-11-14
            for P in bid ask; do
              npx dukascopy-node -i $INS -from $Y-01-01 -to $HASTA -t m1 -p $P -f csv -dir . -r 5 -bs 20 -bp 300 -fr >/dev/null 2>&1 || echo "falla $Y $P"
            done
          done
          ls | wc -l; du -sh .; cd .. && pip install -q pandas numpy && python metodo/v9/extraer.py $SIM velas salida/${SIM}_${Y0}
        env:
          PAR: ${{ matrix.par }}
          TRAMO: ${{ matrix.tramo }}
      - uses: actions/upload-artifact@v4
        with:
          name: m1-${{ strategy.job-index }}
          path: salida/

  juntar:
    needs: [bajar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Guardar
        run: |
          mkdir -p metodo/v9/datos
          find art -type f -exec cp {} metodo/v9/datos/ \;
          ls -la metodo/v9/datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metodo/v9/datos
          git diff --cached --quiet || git commit -m "v9: M1 07:00-17:00 NY y diario de 6 mercados 2011-26"
          git pull --rebase -q || true
          git push
