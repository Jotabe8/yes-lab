name: v3 stop ancho JP225 y ETH

on:
  push:
    branches: [claude/project-thread-dqtmmk]
    paths:
      - .github/workflows/v3-stop-ancho.yml

permissions:
  contents: write

jobs:
  anio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        par: ["JP225:jpnidxjpy:asia", "ETHUSD:ethusd:cripto"]
        y: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y resumir
        env:
          PAR: ${{ matrix.par }}
        run: |
          SIM=$(echo $PAR | cut -d: -f1); INS=$(echo $PAR | cut -d: -f2); TIPO=$(echo $PAR | cut -d: -f3); Y=${{ matrix.y }}
          HASTA=$((Y+1))-01-02; [ $Y = 2026 ] && HASTA=2026-11-13
          mkdir -p velas salida && cd velas
          npm init -y >/dev/null && npm i dukascopy-node@1 >/dev/null 2>&1
          for P in bid ask; do npx dukascopy-node -i $INS -from $((Y-1))-11-01 -to $HASTA -t m1 -p $P -f csv -dir . -r 5 -bs 20 -bp 300 -fr >/dev/null 2>&1 || echo falla $P; done
          cd .. && pip install -q pandas numpy
          if [ $TIPO = asia ]; then python metodo/v3/orb_asia.py $SIM velas $Y salida/ancho_${SIM}_$Y.csv; else python metodo/v3/orb_cripto_medio.py $SIM velas $Y salida/ancho_${SIM}_$Y.csv; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ancho-${{ strategy.job-index }}
          path: salida/

  juntar:
    needs: anio
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Guardar
        run: |
          mkdir -p metodo/v3/stop_ancho
          find art -name '*.csv' -exec cp {} metodo/v3/stop_ancho/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metodo/v3/stop_ancho
          git diff --cached --quiet || git commit -m "v3: stop ancho JP225 y ETH 2018-2026"
          git pull --rebase -q || true
          git push
